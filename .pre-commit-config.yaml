default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # The dataset is gitignored, but a stray notebook checkpoint or a PDF
        # copied out of data/ would otherwise sail through.
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-executables-have-shebangs

  - repo: local
    hooks:
      # .env is gitignored, so this only fires if someone force-adds it. It
      # holds the DocILE token, which is a live credential.
      - id: no-env-file
        name: refuse to commit .env
        entry: .env must never be committed — it holds the DocILE token
        language: fail
        files: ^\.env$
